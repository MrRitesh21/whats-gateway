
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#052e16" />
                <stop offset="50%" stop-color="#064e3b" />
                <stop offset="100%" stop-color="#022c22" />
            </linearGradient>
            <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#34d399" />
                <stop offset="100%" stop-color="#059669" />
            </linearGradient>
            <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#10b981" />
                <stop offset="100%" stop-color="#047857" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="10.24" stdDeviation="20.48" flood-color="#10b981" flood-opacity="0.45" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)" />
        
        <!-- Subtle outer ring -->
        <rect x="15.36" y="15.36" width="481.28" height="481.28" rx="101.376" fill="none" stroke="#10b981" stroke-width="7.68" stroke-opacity="0.35" />

        <!-- Center Chat Bubble Icon Group with Glow -->
        <g transform="translate(25.6, 25.6)" filter="url(#glow)">
            <svg width="460.8" height="460.8" viewBox="0 0 24 24" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <!-- WhatsApp message bubble -->
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" fill="#064e3b" fill-opacity="0.4" />
                <!-- Lightning/Flow dynamic mark inside -->
                <path d="M13 8L9 13h4l-1 5 5-6h-4l1-4z" fill="url(#badgeGrad)" stroke="#6ee7b7" stroke-width="0.75" />
            </svg>
        </g>
    </svg>
    